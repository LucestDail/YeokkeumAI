# prod 프로파일 — PostgreSQL 영속 + Flyway 통제 마이그레이션.
# 활성화: SPRING_PROFILES_ACTIVE=prod. 접속정보는 env(DB_URL/DB_USER/DB_PASSWORD).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/yeokkeum}
    username: ${DB_USER:yeokkeum}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 소유. Hibernate는 검증만.
  flyway:
    enabled: true
    baseline-on-migrate: true
