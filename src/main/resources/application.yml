server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: yeokkeumai
  # eGovFrame 5.0 AI layer — Spring AI(OpenAI 호환). base-url 로 OpenRouter/사내/국산 게이트웨이 연결.
  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${LLM_API_KEY:sk-noop}
      chat:
        options:
          model: ${LLM_MODEL:deepseek/deepseek-chat}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ieum;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}
  # dev(H2)는 flyway 비활성 + ddl-auto=update. prod(PostgreSQL)은 application-prod.yml 에서 flyway+validate.
  flyway:
    enabled: false

# 엮음AI 설정 (벤더무관 게이트웨이 / RBAC secure-by-default / RAG)
ieum:
  llm:
    provider: ${LLM_PROVIDER:auto}          # auto | openai_compat | stub
    base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek/deepseek-chat}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}
  auth:
    admin-token: ${ADMIN_TOKEN:}
    user-token: ${USER_TOKEN:}
    insecure-open-mode: ${INSECURE_OPEN_MODE:false}
  rag:
    chunk-chars: ${RAG_CHUNK_CHARS:1200}
    top-k: ${RAG_TOP_K:5}
    hybrid: ${RAG_HYBRID:true}                       # BM25 + dense(BGE-M3) RRF 융합. 임베딩 없으면 자동 BM25 폴백
    rrf-k: ${RAG_RRF_K:60}
  embedding:
    provider: ${EMBEDDING_PROVIDER:auto}             # auto | openai_compat | stub
    base-url: ${EMBEDDING_BASE_URL:}                 # 예: http://<tei-host>/v1 (BGE-M3 서빙). 비면 stub
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:bge-m3}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:60}
  doc:
    rhwp-path: ${RHWP_PATH:bin/rhwp}                 # HWP/HWPX 파서(rhwp export-text). 없으면 PATH의 rhwp
    rhwp-timeout-ms: ${RHWP_TIMEOUT_MS:30000}

# 관측성 [OBS-1] — health(readiness/liveness·DB)·info 만 노출, 상세는 비공개(정보노출 방지)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
