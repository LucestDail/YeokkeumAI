services:
  ieum:
    build: .
    container_name: ieum
    ports:
      - "${PUBLIC_HTTP_PORT:-8088}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      USER_TOKEN: ${USER_TOKEN:-}
      INSECURE_OPEN_MODE: ${INSECURE_OPEN_MODE:-false}
      DATA_DIR: /app/data
    volumes:
      - ieum_data:/app/data
volumes:
  ieum_data:
